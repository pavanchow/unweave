[package]
name = "unweave"
version = "0.2.1"
edition = "2021"
description = "An EVM bytecode disassembler that reconstructs intent and flags dangerous opcodes"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
