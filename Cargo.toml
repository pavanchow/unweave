[package]
name = "unweave"
version = "0.1.0"
edition = "2021"
description = "An EVM bytecode disassembler that reconstructs intent and flags dangerous opcodes"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
