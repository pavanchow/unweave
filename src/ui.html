<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unweave console</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#8b949e;--line:#30363d;
    --accent:#58a6ff;--crit:#f85149;--high:#db6d28;--med:#d29922;--low:#3fb950}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  header{padding:24px 28px 16px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:21px}
  .sub{color:var(--muted);margin-top:4px;font-size:14px}
  main{max-width:1000px;margin:0 auto;padding:22px 28px 60px}
  textarea{width:100%;min-height:120px;padding:12px;border:1px solid var(--line);border-radius:10px;
    font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--panel);color:var(--ink);resize:vertical;word-break:break-all}
  textarea:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
  button{padding:10px 18px;border:none;border-radius:9px;background:var(--accent);color:#0d1117;font:inherit;font-weight:700;cursor:pointer}
  .meta{color:var(--muted);font-size:13px}
  .flags{margin-top:18px}
  .flag{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:var(--panel)}
  .badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;text-transform:uppercase}
  .b-critical{background:#3d1418;color:var(--crit)} .b-high{background:#3a220f;color:var(--high)}
  .b-medium{background:#332a0d;color:var(--med)} .b-low{background:#0f2e18;color:var(--low)}
  .asm{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;
    font:12.5px/1.55 ui-monospace,Menlo,monospace;max-height:460px;overflow:auto}
  .ln{display:flex;gap:12px} .pc{color:var(--muted);width:56px;flex:none}
  .op{color:var(--ink)} .op.danger{color:var(--crit);font-weight:700} .imm{color:var(--accent)}
  .err{color:var(--crit);background:#3d1418;border:1px solid #5a1f24;padding:10px 12px;border-radius:8px;margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>Unweave console</h1>
  <div class="sub">Paste EVM bytecode. See the disassembly with dangerous opcodes flagged.</div>
</header>
<main>
  <textarea id="hex" spellcheck="false">0x60016000556001600060006000600073deadbeefdeadbeefdeadbeefdeadbeefdeadbeef5af4</textarea>
  <div class="row"><button onclick="go()">Disassemble</button><span class="meta" id="meta"></span></div>
  <div id="out"></div>
</main>
<script>
const DANGER=new Set(['DELEGATECALL','CALLCODE','SELFDESTRUCT','CALL','CREATE2','ORIGIN']);
const out=document.getElementById('out'), meta=document.getElementById('meta');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function go(){
  out.innerHTML=''; meta.textContent='disassembling...';
  try{
    const res=await fetch('/disasm',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({hex:document.getElementById('hex').value})});
    const d=await res.json();
    if(!res.ok||d.error){out.innerHTML=`<div class="err">${esc(d.error||'error')}</div>`;meta.textContent='';return}
    meta.textContent=`${d.byte_len} bytes, ${d.instruction_count} instructions, ${d.block_count} blocks, ${d.selectors.length} selectors, ${d.flagged_count} flagged`;
    let html='';
    if(d.flags.length){
      html+='<div class="flags">';
      for(const f of d.flags) html+=`<div class="flag"><span class="badge b-${esc(f.severity)}">${esc(f.severity)}</span> <b>${esc(f.op)}</b> at pc ${f.pc}<div class="meta" style="margin-top:6px">${esc(f.note)}</div></div>`;
      html+='</div>';
    }
    html+='<div class="asm">';
    for(const i of d.instructions){
      const danger=DANGER.has(i.name)?' danger':'';
      const imm=i.operand?` <span class="imm">0x${esc(i.operand)}</span>`:'';
      html+=`<div class="ln"><span class="pc">${i.pc.toString(16).padStart(4,'0')}</span><span class="op${danger}">${esc(i.name)}${imm}</span></div>`;
    }
    html+='</div>';
    out.innerHTML=html;
  }catch(e){out.innerHTML=`<div class="err">${esc(e.message)}</div>`;meta.textContent='';}
}
go();
</script>
</body>
</html>
